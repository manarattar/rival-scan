services:
  - type: web
    name: rival-scan-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.cerebras.ai/v1
      - key: MODEL_NAME
        value: llama-3.3-70b
      - key: MOCK_MODE
        value: false
      # Managed Postgres connection string (e.g. Neon). Without it the app
      # falls back to SQLite, which does not survive a restart on this plan.
      - key: DATABASE_URL
        sync: false
    # NOTE: no `disk:` here on purpose. Render's free plan does not support
    # persistent disks, and the previous mountPath (/app/data) never matched
    # the SQLite path anyway -- rootDir is `backend`, so the database resolved
    # to backend/data/rivalscan.db on the ephemeral filesystem. Use
    # DATABASE_URL above for persistence instead.

  - type: web
    name: rival-scan-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
